# 构建静态产物并发布到 GitHub Pages
# 项目页地址：https://<owner>.github.io/codeviz/
name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# 只保留最近一次发布，避免并发推送互相覆盖
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check & unit tests
        run: |
          pnpm exec tsc --noEmit
          pnpm exec vitest run

      - name: Build
        run: pnpm exec vite build

      - name: Verify build output
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html 不存在，构建没有产出"; exit 1; }
          if grep -q 'src/main.tsx' dist/index.html; then
            echo "::error::dist/index.html 仍引用源码入口 /src/main.tsx，产物不正确"
            exit 1
          fi
          if ! ls dist/assets/*.js >/dev/null 2>&1; then
            echo "::error::dist/assets 下没有 JS 产物"
            exit 1
          fi

      - name: Disable Jekyll processing
        run: touch dist/.nojekyll

      # 说明：GitHub 的 GITHUB_TOKEN 无权创建 Pages 站点，所以首次必须在
      # 仓库 Settings → Pages → Build and deployment → Source 里选择「GitHub Actions」，
      # 之后本工作流才能持续发布到这个地址：https://lmdlg000.github.io/codeviz/
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
